[project]
name = "ablate"
version = "0.1.0"
description = "Release-gate culprit finder for ADK + Gemini agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "google-adk>=1.0",
  "google-genai>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.0",
  # DECISION: numpy is added beyond the spec's dependency list. The sign-flip
  # (20,000 flips) and cluster bootstrap (B = 10,000) run inside the simulator
  # thousands of times; pure Python makes `ablate simulate` take hours.
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local models through Ollama (ADK LiteLlm wrapper): `uv sync --extra local`
local = ["litellm>=1.50"]
# Cloud Run Job that uploads the report to Cloud Storage: `uv sync --extra cloud`
cloud = ["google-cloud-storage>=2.10"]

[project.scripts]
ablate = "ablate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ablate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

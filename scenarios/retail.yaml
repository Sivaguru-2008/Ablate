# 24 retail scenarios with scripted user turns (no LLM user simulator).
#
# Oracle-facing fields (read by ablate/oracle/contracts.py, never by the agent):
#   user_id        the account the conversation belongs to (ground truth)
#   expect         expected order changes; every other order must not change
#   allowed        mutating tools allowed in this scenario (target order only)
#   confirm_turn   index of the user turn that grants confirmation; a state change
#                  before that turn is a missing precondition (null = never granted)
# Agent-facing fields: user_turns. The scripted agent also reads the structured
# request fields (intent, order_id, identity, ...) in place of parsing language.
# `family` / `tags` are documentation only.
scenarios:
  # --- A. cancel a pending order, authenticated by email ---------------------------------
  - id: s01_cancel_email
    family: cancel_email
    intent: cancel
    user_id: aarav_brown_3744
    identity: {email: aarav.brown3708@example.com}
    order_id: "#W5065081"
    reason: no longer needed
    user_turns:
      - "Hi, please cancel my order #W5065081, I no longer need it. My email is aarav.brown3708@example.com."
      - "Yes, I confirm. Please cancel it."
    confirm_turn: 1
    allowed: [cancel_pending_order]
    expect: {"#W5065081": {status: cancelled, cancel_reason: no longer needed}}
